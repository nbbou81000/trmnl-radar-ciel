- keyname: style
  field_type: select
  name: Style d'affichage
  description: Classique (framework TRMNL), panneau LED à points, ou tableau d'aéroport à palettes.
  options:
  - "Classique: classique"
  - "LED: led"
  - "Flip-flap: flip-flap"
  default: classique

- keyname: zone_affichage
  field_type: select
  name: Écran au-dessus de chez moi
  description: Tableau des avions proches (dans le style choisi) ou carte avec le rayon de recherche et les avions orientés selon leur cap.
  options:
  - "Tableau: tableau"
  - "Carte: carte"
  default: tableau

- keyname: suivi_affichage
  field_type: select
  name: Écran pendant le suivi d'un vol
  description: Tableau de suivi (dans le style choisi), carte avec la position de l'avion, ou fiche détaillée du vol et de l'appareil.
  options:
  - "Tableau de suivi: tableau"
  - "Carte: carte"
  - "Fiche détaillée: fiche"
  default: tableau

- keyname: style_carte
  field_type: select
  name: Style de la carte
  help_text: S'applique aux deux cartes (au-dessus de chez moi et suivi d'un vol).
  description: Contours (côtes et frontières), Rues (routes, villes et détails), Minimal (terre, eau et grands axes) ou Épuré (fond blanc, seulement le trajet).
  options:
  - "Contours: outline"
  - "Rues: streets"
  - "Minimal: minimal"
  - "Épuré: blank"
  default: outline
